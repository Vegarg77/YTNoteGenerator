<!doctype html>
<html>
  <head>
    <meta charset="utf-8"/>
    <title>YT → Obsidian: Result</title>
    <style>
      :root {
        --bg:#0f172a; --panel:#0b1220; --muted:#94a3b8; --text:#e5e7eb; --accent:#22d3ee; --accent-2:#38bdf8;
      }
      body { margin:0; background:var(--bg); color:var(--text); font:14px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .wrap { max-width: 840px; margin: 24px auto; padding: 0 16px; }
      .card { background:var(--panel); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:16px; box-shadow: 0 6px 24px rgba(0,0,0,0.35); }
      h1 { font-size:18px; margin:0 0 12px; }
      .meta { color:var(--muted); margin-bottom: 12px; }
      textarea {
        width:100%; height: 420px; background:#060b16; color:var(--text);
        border:1px solid rgba(255,255,255,0.12); border-radius:10px; padding:12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; line-height:1.4;
      }
      .row { display:flex; gap:8px; align-items:center; justify-content:space-between; margin-top:12px; }
      .btn {
        padding:10px 14px; border:0; border-radius:10px; color:#041017; font-weight:700; letter-spacing:.3px; cursor:pointer;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
      }
      .pill { padding: 4px 10px; border-radius:999px; background:#060b16; border:1px solid rgba(255,255,255,0.12); color:var(--muted); font-size:12px; }
      .ok { color:#22c55e; margin-left:12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1 id="title">Note Ready</h1>
        <div id="meta" class="meta"></div>
        <div id="videolink" class="meta"></div>
        <textarea id="md"></textarea>
        <div class="row">
          <button id="copy" class="btn">Copy Markdown</button>
          <div id="hint" class="pill">Click to copy → paste into Obsidian</div>
        </div>
        <div id="copied" class="ok" style="display:none;">Copied to clipboard ✅</div>
      </div>
    </div>
    <script src="result.js"></script>
  </body>
</html>
