<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>YT→Obsidian Options</title>
    <style>
      body { font: 14px system-ui, sans-serif; padding: 16px; max-width: 680px; }
      label { display:block; margin-top: 12px; font-weight: 600; }
      input[type="text"] { width: 100%; padding: 8px; }
      .hint { color: #555; font-size: 12px; }
      button { margin-top: 12px; padding: 8px 12px; }
    </style>
  </head>
  <body>
    <h2>YT → Obsidian: Options</h2>

    <label for="model">OpenAI Model</label>
    <input id="model" type="text" value="gpt-4o-mini" />
    <div class="hint">Used when you run the popup. API key is typed each session and never stored.</div>

    <button id="save">Save</button>
    <span id="msg" class="hint"></span>

    <script src="options.js"></script>
  </body>
</html>
