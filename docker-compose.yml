services:
  app:
    build: .
    ports:
      - "5173:5173"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - BRIGHT_DATA_API_TOKEN=${BRIGHT_DATA_API_TOKEN}
      - BRIGHT_DATA_YT_DATASET_ID=${BRIGHT_DATA_YT_DATASET_ID}
      - BRIGHT_DATA_API_BASE=${BRIGHT_DATA_API_BASE:-https://api.brightdata.com}
      - BRIGHT_DATA_TIMEOUT_MS=${BRIGHT_DATA_TIMEOUT_MS:-120000}
      - BRIGHT_DATA_POLL_INTERVAL_MS=${BRIGHT_DATA_POLL_INTERVAL_MS:-2000}
      - OBSIDIAN_NOTE_DIR=${OBSIDIAN_NOTE_DIR:-/data/notes}
      - OBSIDIAN_DICTIONARY_DIR=${OBSIDIAN_DICTIONARY_DIR:-/data/dictionary}
      - OBSIDIAN_BUSINESS_DIR=${OBSIDIAN_BUSINESS_DIR:-/data/business}
    volumes:
      - notes-data:/data
    restart: unless-stopped

volumes:
  notes-data:
