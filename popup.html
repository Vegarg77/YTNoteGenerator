<!doctype html>
<html>
  <head>
    <meta charset="utf-8"/>
    <title>YT → Obsidian (Clipboard)</title>
    <style>
      :root {
        --bg:#0f172a;
        --panel:#111827;
        --muted:#94a3b8;
        --text:#e5e7eb;
        --accent:#22d3ee;
        --accent-2:#38bdf8;
        --ok:#22c55e;
        --err:#ef4444;
      }
      * { box-sizing: border-box; }
      body {
        font: 14px system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 0; padding: 0;
        width: 360px; background: linear-gradient(135deg, #0b1022, #111827);
        color: var(--text);
      }
      .wrap { padding: 16px; }
      .card {
        background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 14px; padding: 16px;
        box-shadow: 0 6px 24px rgba(0,0,0,0.35);
      }
      h1 {
        font-size: 16px; margin: 0 0 8px; letter-spacing: .3px;
        display:flex; align-items:center; gap:8px;
      }
      h1 .logo {
        width: 18px; height: 18px; border-radius: 4px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        display:inline-block;
      }
      label { display:block; margin: 10px 0 6px; color: var(--muted); }
      input[type="password"] {
        width: 100%; padding: 10px 12px; border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.1); background: #0b1220; color: var(--text);
        outline: none;
      }
      input[type="password"]::placeholder { color: #5f6b83; }
      .err { color: var(--err); font-size: 12px; margin-top: 6px; min-height: 16px; }
      .btn {
        width: 100%; padding: 10px 12px; border: none; border-radius: 10px;
        color: #041017; font-weight: 700; letter-spacing: .3px; cursor: pointer;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        transition: transform .05s ease, filter .15s ease;
        margin-top: 10px;
      }
      .btn:hover { filter: brightness(1.05); }
      .btn:active { transform: translateY(1px); }
      .subtle { color: var(--muted); font-size: 12px; margin-top: 6px; }
      .stepper { display:flex; gap:8px; margin-bottom: 10px; }
      .step {
        flex:1; height: 6px; border-radius: 999px; background: #1f2937; overflow:hidden;
        position: relative;
      }
      .step.fill::after {
        content:""; position:absolute; inset:0;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        box-shadow: 0 0 16px var(--accent);
        animation: fill 0.6s ease forwards;
        transform-origin: left center;
      }
      @keyframes fill { from{transform: scaleX(0)} to{transform: scaleX(1)} }
      .hidden { display:none; }

      /* Progress section */
      .progress-bar {
        height: 10px; border-radius: 999px; background: #1f2937; overflow: hidden; margin-top: 8px;
        border: 1px solid rgba(255,255,255,0.08);
      }
      .progress-fill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transition: width .25s ease;
      }
      .log {
        margin-top: 10px; max-height: 140px; overflow:auto; padding: 8px;
        background: #0b1220; border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px; line-height: 1.35;
      }
      .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
      .pill { padding: 2px 8px; border-radius: 999px; background:#0b1220; border:1px solid rgba(255,255,255,0.1); color:var(--muted); font-size:12px; }
      .good { color: var(--ok); }
      .bad { color: var(--err); }

      /* tiny shake when invalid */
      @keyframes shake {
        10%, 90% { transform: translateX(-1px); }
        20%, 80% { transform: translateX(2px); }
        30%, 50%, 70% { transform: translateX(-4px); }
        40%, 60% { transform: translateX(4px); }
      }
      .shake { animation: shake .4s linear; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1><span class="logo"></span> YT → Obsidian (Clipboard)</h1>

        <!-- Step indicators -->
        <div class="stepper">
          <div id="s1" class="step"></div>
          <div id="s2" class="step"></div>
          <div id="s3" class="step"></div>
        </div>

        <!-- View 1: API Key -->
        <div id="viewKey">
          <label for="apiKey">OpenAI API key (not saved)</label>
          <input id="apiKey" type="password" placeholder="Paste your API key" autocomplete="off" />
          <button id="next" class="btn">Continue</button>
          <div id="keyErr" class="err"></div>
          <div class="subtle">Your key stays in-memory only for this run.</div>
        </div>

        <!-- View 2: Action + Progress -->
        <div id="viewRun" class="hidden">
          <div class="row">
            <div class="pill">Mode: Clipboard</div>
            <div id="statusSmall" class="subtle">Ready</div>
          </div>
          <button id="run" class="btn">Make Obsidian Note → Clipboard</button>

          <div class="progress-bar"><div id="pfill" class="progress-fill"></div></div>
          <div id="pct" class="subtle">0%</div>
          <div id="log" class="log" aria-live="polite"></div>
        </div>

      </div>
    </div>

    <!-- MV3: JS must be in an external file -->
    <script src="popup.js"></script>
  </body>
</html>
